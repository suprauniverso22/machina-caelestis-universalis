name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Construir sitio
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npx playwright install --with-deps chromium
      - name: Verificar sitio de producción
        run: npm run test:e2e
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-pruebas
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4